global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    retries 3
    timeout connect        10s
    timeout http-request    60s
    timeout http-keep-alive 5s
    # DICOM STOW-RS uploads and long-running report generation can run for hours —
    # match nginx's client/proxy timeouts (see nginx/templates/noctis.conf.template)
    # so HAProxy isn't the thing that cuts a slow transfer off first.
    timeout client          21600s
    timeout server          21600s
    # Keeps WebSocket (Django Channels) connections alive once HAProxy detects the
    # 101 Switching Protocols response and switches that connection to tunnel mode.
    timeout tunnel          21600s
    timeout client-fin      30s
    timeout server-fin      30s

# Resolves the `web` service name against Docker's embedded DNS so the backend below
# picks up every replica when the service is scaled (`--scale web=N`), without a static
# IP list or a config reload.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry   1s
    hold valid      10s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s

frontend fe_web
    bind *:8000
    default_backend be_web

backend be_web
    balance leastconn
    # /health/simple/ (noctis_pro/health.py) is a dependency-free 200 OK built for
    # exactly this — cheap enough to poll every few seconds without load-testing the DB.
    # Explicit Host header: `option httpchk` alone sends no Host header, and Django's
    # ALLOWED_HOSTS validation 400s any request without one, regardless of what's allowed.
    http-check send meth GET uri /health/simple/ hdr Host web
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
    # 20 template slots: headroom above any expected replica count. Unresolved slots just
    # sit DOWN at ~0 cost — raise it if you ever scale web past 20.
    server-template web- 20 web:8000 check

    # Opportunistic secondary node(s) — e.g. a laptop joined over Tailscale, see
    # DEPLOY_OPPORTUNISTIC_NODE.md. Managed by scripts/add-opportunistic-node.sh, which
    # inserts/removes `server` lines between these markers; don't hand-edit inside them,
    # your changes will be overwritten the next time that script runs. A static IP (not
    # server-template/resolvers) is deliberate: Tailscale assigns a stable IP per device,
    # so there's nothing to discover. Looser inter/fall/rise than the cloud-local replicas
    # above — a home internet connection has brief hiccups that shouldn't evict it as
    # aggressively as a same-host container actually failing.
    # BEGIN-OPPORTUNISTIC-NODES
    # END-OPPORTUNISTIC-NODES

# Internal-only stats/health view for this LB tier itself — not published to the host in
# docker-compose.prod.yml, so it's reachable inside the Docker network but not the internet.
frontend fe_stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
